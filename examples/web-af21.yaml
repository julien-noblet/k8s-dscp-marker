apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-example
  template:
    metadata:
      labels:
        app: web-example
      annotations:
        dscp-marker.io/class: "AF21"
    spec:
      containers:
        - name: app
          image: example/web-frontend:latest
