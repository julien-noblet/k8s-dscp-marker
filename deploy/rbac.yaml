apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-dscp-marker
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-dscp-marker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-dscp-marker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-dscp-marker
subjects:
  - kind: ServiceAccount
    name: k8s-dscp-marker
    namespace: kube-system
